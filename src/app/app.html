<!-- MENÚ DE NAVEGACIÓN (Bootstrap navbar, se colapsa en celular) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/mascotas">🐾 Huellitas Oruro</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <!-- routerLinkActive agrega la clase "active" a la sección actual -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/mascotas" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-search"></i> Mascotas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/solicitudes/nueva" routerLinkActive="active">
            <i class="bi bi-heart"></i> Solicitar adopción
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/solicitudes" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-clock-history"></i> Historial
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/mascotas/publicar" routerLinkActive="active">
            <i class="bi bi-plus-circle"></i> Publicar mascota
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        @if (auth.usuario(); as u) {
          <span class="navbar-text text-white small"><i class="bi bi-person-circle"></i> {{ u.nombre }}</span>
          <button class="btn btn-sm btn-outline-light" (click)="salir()">Salir</button>
        } @else {
          <a class="btn btn-sm btn-light" routerLink="/login">Ingresar</a>
        }
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
