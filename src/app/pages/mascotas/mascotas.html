<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div>
    <h1 class="h3 mb-0">Mascotas en adopción</h1>
    <p class="text-body-secondary mb-0">Encuentra a tu nuevo compañero o publica uno que necesite hogar.</p>
  </div>
  <a class="btn btn-outline-success" routerLink="/mascotas/publicar">
    <i class="bi bi-plus-circle"></i> Publicar mascota
  </a>
</div>

<!-- FILTROS: enlace de propiedades [value] + enlace de eventos (input)/(change) -->
<div class="card card-body shadow-sm mb-4">
  <div class="row g-2">
    <div class="col-12 col-md-5">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input class="form-control" placeholder="Buscar por nombre, descripción o zona..."
               [value]="texto()" (input)="texto.set($any($event.target).value)">
      </div>
    </div>
    <div class="col-6 col-md-3">
      <select class="form-select" [value]="especie()" (change)="especie.set($any($event.target).value)">
        <option value="">Todas las especies</option>
        <option value="perro">Perros</option>
        <option value="gato">Gatos</option>
        <option value="otro">Otros</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <select class="form-select" [value]="estado()" (change)="estado.set($any($event.target).value)">
        <option value="">Todos los estados</option>
        <option value="Disponible">Disponible</option>
        <option value="En proceso">En proceso</option>
        <option value="Adoptada">Adoptada</option>
      </select>
    </div>
    <div class="col-12 col-md-2 d-grid">
      <button class="btn btn-outline-secondary" (click)="limpiar()">Limpiar</button>
    </div>
  </div>
</div>

@if (cargando()) {
  <div class="text-center py-5"><div class="spinner-border text-success"></div></div>
} @else {
  <p class="text-body-secondary small">{{ filtradas().length }} de {{ mascotas().length }} mascotas</p>

  <div class="row g-3">
    @for (m of filtradas(); track m.id) {
      <div class="col-12 col-sm-6 col-lg-4">
        <!-- Padre -> hijo: [mascota]   |   Hijo -> padre: (solicitar) -->
        <app-mascota-card [mascota]="m"
                          [esMia]="m.publicadaPor === auth.usuario()?.id"
                          (solicitar)="irASolicitar($event)" />
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-info">No hay mascotas que coincidan con la búsqueda.</div>
      </div>
    }
  </div>
}
